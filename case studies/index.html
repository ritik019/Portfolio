<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Voice Input — Prototype</title>
<style>
  /* ── Reset & Base ──────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #10A37F;
    --accent-dark: #0D8A6A;
    --bg: #212121;
    --bg-light: #2A2A2A;
    --bg-input: #303030;
    --surface: #343541;
    --text: #ECECF1;
    --text-dim: #8E8EA0;
    --red: #EF4444;
    --yellow: #FACC15;
    --radius: 16px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Phone Frame ───────────────────────────────────────── */
  .phone-bezel {
    width: 375px;
    height: 812px;
    background: #000;
    border-radius: 44px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #333,
      0 30px 80px rgba(0,0,0,.6);
    position: relative;
    overflow: hidden;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    background: var(--bg);
    border-radius: 34px;
    overflow: hidden;
    position: relative;
  }

  /* ── Status Bar ────────────────────────────────────────── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    position: relative;
    z-index: 10;
  }
  .status-bar .notch {
    width: 120px;
    height: 28px;
    background: #000;
    border-radius: 0 0 18px 18px;
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
  }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; fill: var(--text); }

  /* ── Screens Container ─────────────────────────────────── */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
    transform: translateY(12px);
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* ═══════════════════════════════════════════════════════
     SCREEN 1 — HOME
     ═══════════════════════════════════════════════════════ */
  #screen-home { background: var(--bg); }

  .home-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 28px;
  }

  .gpt-logo {
    width: 48px; height: 48px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 22px;
    color: #fff;
    font-weight: 700;
  }

  .home-heading {
    font-size: 26px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
    line-height: 1.3;
  }

  .model-badge {
    margin-top: 14px;
    padding: 6px 16px;
    background: var(--bg-input);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .model-badge .dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ── Input Bar (shared style) ──────────────────────────── */
  .input-bar {
    padding: 12px 16px 32px;
    position: relative;
  }
  .input-wrapper {
    display: flex;
    align-items: center;
    background: var(--bg-input);
    border-radius: 26px;
    padding: 10px 10px 10px 18px;
    border: 1px solid #444;
    position: relative;
  }
  .input-wrapper input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font);
  }
  .input-wrapper input::placeholder { color: var(--text-dim); }

  .mic-btn {
    width: 40px; height: 40px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .15s, box-shadow .15s;
    position: relative;
  }
  .mic-btn:hover { transform: scale(1.08); }
  .mic-btn:active { transform: scale(.95); }
  .mic-btn svg { width: 20px; height: 20px; fill: #fff; }

  /* Mic pulse ring on home */
  .mic-btn.pulse::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    animation: mic-pulse 2s ease-out infinite;
  }
  @keyframes mic-pulse {
    0%   { transform: scale(1); opacity: .7; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* ── Tooltip / Nudge ───────────────────────────────────── */
  .nudge {
    position: absolute;
    bottom: calc(100% + 10px);
    right: 6px;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(16,163,127,.35);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: nudge-in .5s ease .3s both;
  }
  .nudge::after {
    content: '';
    position: absolute;
    bottom: -6px;
    right: 20px;
    width: 12px; height: 12px;
    background: var(--accent);
    transform: rotate(45deg);
    border-radius: 2px;
  }
  .nudge-close {
    background: none;
    border: none;
    color: rgba(255,255,255,.7);
    font-size: 16px;
    cursor: pointer;
    padding: 0 0 0 4px;
    line-height: 1;
  }
  .nudge-close:hover { color: #fff; }
  .nudge.hidden { display: none; }

  @keyframes nudge-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ═══════════════════════════════════════════════════════
     SCREEN 2 — LISTENING
     ═══════════════════════════════════════════════════════ */
  #screen-listen {
    background: rgba(0,0,0,.92);
    justify-content: center;
    align-items: center;
    padding: 40px 28px;
  }

  .listen-label {
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
    animation: fade-pulse 1.8s ease-in-out infinite;
  }
  @keyframes fade-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .55; }
  }

  .lang-badge {
    background: var(--bg-input);
    padding: 5px 14px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 36px;
    border: 1px solid #444;
  }

  /* ── Waveform ──────────────────────────────────────────── */
  .waveform {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 80px;
    margin-bottom: 36px;
  }
  .waveform .bar {
    width: 5px;
    background: var(--accent);
    border-radius: 3px;
    animation: wave 1s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { height: 12px; opacity: .4; }
    50%      { height: var(--h, 50px); opacity: 1; }
  }

  /* ── Live Transcription ────────────────────────────────── */
  .transcript-live {
    font-size: 18px;
    line-height: 1.6;
    color: var(--text);
    text-align: center;
    min-height: 60px;
    max-width: 300px;
  }
  .transcript-live .cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink .6s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .stop-btn {
    margin-top: auto;
    width: 64px; height: 64px;
    background: var(--red);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s;
    box-shadow: 0 4px 24px rgba(239,68,68,.4);
  }
  .stop-btn:hover { transform: scale(1.08); }
  .stop-btn:active { transform: scale(.92); }
  .stop-btn .stop-icon {
    width: 22px; height: 22px;
    background: #fff;
    border-radius: 4px;
  }

  /* ═══════════════════════════════════════════════════════
     SCREEN 3 — EDIT
     ═══════════════════════════════════════════════════════ */
  #screen-edit {
    background: var(--bg);
    padding-top: 0;
  }

  .edit-header {
    text-align: center;
    padding: 60px 24px 20px;
  }
  .edit-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .edit-header p {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .edit-area-wrapper {
    flex: 1;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .edit-textarea {
    width: 100%;
    min-height: 140px;
    background: var(--bg-input);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 16px;
    color: var(--text);
    font-size: 16px;
    font-family: var(--font);
    line-height: 1.6;
    resize: none;
    outline: none;
    transition: border-color .2s;
  }
  .edit-textarea:focus { border-color: var(--accent); }

  /* ── Confidence Callout ────────────────────────────────── */
  .confidence-note {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: rgba(250,204,21,.08);
    border: 1px solid rgba(250,204,21,.25);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .confidence-note .icon {
    flex-shrink: 0;
    font-size: 16px;
    margin-top: 1px;
  }
  .confidence-note mark {
    background: rgba(250,204,21,.25);
    color: var(--yellow);
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 600;
  }

  .edit-actions {
    padding: 20px 20px 36px;
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn-gray  { background: var(--bg-input); color: var(--text-dim); border: 1px solid #444; }
  .btn-green { background: var(--accent); color: #fff; box-shadow: 0 4px 20px rgba(16,163,127,.35); }
  .btn-green:hover { box-shadow: 0 6px 28px rgba(16,163,127,.5); }

  /* ═══════════════════════════════════════════════════════
     SCREEN 4 — CHAT
     ═══════════════════════════════════════════════════════ */
  #screen-chat {
    background: var(--bg);
  }

  .chat-top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 52px 20px 14px;
    border-bottom: 1px solid #333;
  }
  .chat-top-bar span {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Scrollbar */
  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  .msg {
    max-width: 88%;
    padding: 14px 16px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.6;
    position: relative;
  }
  .msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg-user .voice-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    opacity: .75;
    margin-top: 8px;
  }

  .msg-ai {
    align-self: flex-start;
    background: var(--surface);
    color: var(--text);
    border-bottom-left-radius: 6px;
  }

  .ai-typing-cursor::after {
    content: '▌';
    color: var(--accent);
    animation: blink .6s step-end infinite;
  }

  /* ═══════════════════════════════════════════════════════
     Responsive
     ═══════════════════════════════════════════════════════ */
  @media (max-width: 420px) {
    .phone-bezel {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }
    .phone-screen { border-radius: 0; }
  }
</style>
</head>
<body>

<!-- ═══ PHONE FRAME ═══════════════════════════════════════ -->
<div class="phone-bezel">
<div class="phone-screen">

  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2a12.73 12.73 0 0118 0l2-2A15.57 15.57 0 001 9zm4 4l2 2a8.5 8.5 0 0110 0l2-2a11.36 11.36 0 00-14 0zm4 4l3 3 3-3a4.24 4.24 0 00-6 0z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M2 17h2v5H2zm4-4h2v9H6zm4-4h2v13h-2zm4-3h2v16h-2zm4-4h2v20h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M17 5H7a4 4 0 00-4 4v2a4 4 0 004 4h10a4 4 0 004-4V9a4 4 0 00-4-4zm2 6a2 2 0 01-2 2H7a2 2 0 01-2-2V9a2 2 0 012-2h10a2 2 0 012 2zM20 9v2h2V9z"/><rect x="6" y="8" width="8" height="4" rx="1" fill="var(--accent)"/></svg>
    </div>
  </div>

  <!-- ═══ SCREEN 1: HOME ═════════════════════════════════ -->
  <div id="screen-home" class="screen active">
    <div class="home-body">
      <div class="gpt-logo">✦</div>
      <h1 class="home-heading">What can I help with?</h1>
      <div class="model-badge"><span class="dot"></span> ChatGPT 4o</div>
    </div>
    <div class="input-bar">
      <div class="input-wrapper">
        <input type="text" placeholder="Message ChatGPT…" readonly>
        <button class="mic-btn pulse" id="mic-home" aria-label="Start voice input">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-4 8.93V22h-2v-2.07A8 8 0 014 12H6a6 6 0 0012 0h2a8 8 0 01-7 7.93z"/></svg>
          <div class="nudge" id="nudge">
            🎤 Try voice — works in Hindi &amp; English!
            <button class="nudge-close" id="nudge-close" aria-label="Dismiss">&times;</button>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══ SCREEN 2: LISTENING ════════════════════════════ -->
  <div id="screen-listen" class="screen">
    <div class="listen-label">Listening…</div>
    <div class="lang-badge">EN / HI</div>

    <div class="waveform" id="waveform"></div>

    <div class="transcript-live" id="transcript-live"><span class="cursor"></span></div>

    <button class="stop-btn" id="stop-btn" aria-label="Stop recording">
      <div class="stop-icon"></div>
    </button>
  </div>

  <!-- ═══ SCREEN 3: EDIT ═════════════════════════════════ -->
  <div id="screen-edit" class="screen">
    <div class="edit-header">
      <h2>✏️ Review &amp; Edit Your Voice Input</h2>
      <p>Tap any word to correct it before sending</p>
    </div>
    <div class="edit-area-wrapper">
      <textarea class="edit-textarea" id="edit-textarea" spellcheck="false">Explain the difference between machine learning and deep learning with examples</textarea>

      <div class="confidence-note">
        <span class="icon">⚠️</span>
        <span>Low confidence on word <mark>deep</mark> — tap to correct if needed</span>
      </div>
    </div>
    <div class="edit-actions">
      <button class="btn btn-gray" id="btn-rerecord">🎤 Re-record</button>
      <button class="btn btn-green" id="btn-send">Send ➤</button>
    </div>
  </div>

  <!-- ═══ SCREEN 4: CHAT ═════════════════════════════════ -->
  <div id="screen-chat" class="screen">
    <div class="chat-top-bar"><span>ChatGPT</span></div>
    <div class="chat-body" id="chat-body">
      <div class="msg msg-user">
        Explain the difference between machine learning and deep learning with examples
        <div class="voice-badge">🎤 Voice input</div>
      </div>
      <div class="msg msg-ai" id="ai-response"></div>
    </div>
    <div class="input-bar">
      <div class="input-wrapper">
        <input type="text" placeholder="Follow-up message…" readonly>
        <button class="mic-btn" id="mic-chat" aria-label="Voice follow-up">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-4 8.93V22h-2v-2.07A8 8 0 014 12H6a6 6 0 0012 0h2a8 8 0 01-7 7.93z"/></svg>
        </button>
      </div>
    </div>
  </div>

</div><!-- /phone-screen -->
</div><!-- /phone-bezel -->

<script>
(function () {
  /* ── Elements ────────────────────────────────────────── */
  const screens     = document.querySelectorAll('.screen');
  const micHome     = document.getElementById('mic-home');
  const nudge       = document.getElementById('nudge');
  const nudgeClose  = document.getElementById('nudge-close');
  const stopBtn     = document.getElementById('stop-btn');
  const btnRerecord = document.getElementById('btn-rerecord');
  const btnSend     = document.getElementById('btn-send');
  const micChat     = document.getElementById('mic-chat');
  const transcriptEl= document.getElementById('transcript-live');
  const aiResponseEl= document.getElementById('ai-response');
  const editTextarea= document.getElementById('edit-textarea');

  /* ── Helpers ─────────────────────────────────────────── */
  function goTo(id) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ── Build waveform bars ─────────────────────────────── */
  const waveform = document.getElementById('waveform');
  for (let i = 0; i < 32; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const maxH = 20 + Math.random() * 50;
    bar.style.setProperty('--h', maxH + 'px');
    bar.style.animationDelay = (Math.random() * 1).toFixed(2) + 's';
    bar.style.animationDuration = (0.6 + Math.random() * 0.8).toFixed(2) + 's';
    waveform.appendChild(bar);
  }

  /* ── Transcription Text ──────────────────────────────── */
  const transcriptionWords = [
    'Explain','the','difference','between','machine',
    'learning','and','deep','learning','with','examples'
  ];

  let wordIndex = 0;
  let typingInterval = null;

  function startTyping() {
    wordIndex = 0;
    transcriptEl.innerHTML = '<span class="cursor"></span>';

    typingInterval = setInterval(() => {
      if (wordIndex >= transcriptionWords.length) {
        clearInterval(typingInterval);
        return;
      }
      const cursor = transcriptEl.querySelector('.cursor');
      const wordSpan = document.createElement('span');
      wordSpan.textContent = (wordIndex > 0 ? ' ' : '') + transcriptionWords[wordIndex];
      wordSpan.style.animation = 'fadeWord .25s ease both';
      transcriptEl.insertBefore(wordSpan, cursor);
      wordIndex++;
    }, 320);
  }

  function stopTyping() {
    if (typingInterval) clearInterval(typingInterval);
  }

  /* ── AI Response Text ────────────────────────────────── */
  const aiText = `Great question! Here's a clear breakdown:

**Machine Learning (ML)** is a broad field where algorithms learn patterns from data to make predictions — without being explicitly programmed for each task.

• Example: A spam filter that learns which emails are junk based on past examples.

**Deep Learning (DL)** is a subset of ML that uses neural networks with many layers ("deep" networks) to learn complex patterns automatically.

• Example: A voice assistant converting your speech to text using a deep neural network.

**Key difference:** Traditional ML often needs hand-crafted features, while deep learning discovers features on its own — but requires much more data and compute.`;

  let charIndex = 0;
  let aiTypingInterval = null;

  function startAITyping() {
    charIndex = 0;
    aiResponseEl.textContent = '';
    aiResponseEl.classList.add('ai-typing-cursor');

    aiTypingInterval = setInterval(() => {
      if (charIndex >= aiText.length) {
        clearInterval(aiTypingInterval);
        aiResponseEl.classList.remove('ai-typing-cursor');
        // render markdown-ish bold
        aiResponseEl.innerHTML = aiResponseEl.textContent
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        return;
      }
      aiResponseEl.textContent += aiText[charIndex];
      charIndex++;
      // auto-scroll
      document.getElementById('chat-body').scrollTop = 99999;
    }, 12);
  }

  /* ── CSS for word fade-in ────────────────────────────── */
  const style = document.createElement('style');
  style.textContent = '@keyframes fadeWord{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}';
  document.head.appendChild(style);

  /* ── Event Wiring ────────────────────────────────────── */

  // Dismiss nudge
  nudgeClose.addEventListener('click', (e) => {
    e.stopPropagation();
    nudge.classList.add('hidden');
  });

  // Home mic → Listening
  micHome.addEventListener('click', () => {
    goTo('screen-listen');
    startTyping();
  });

  // Stop → Edit
  stopBtn.addEventListener('click', () => {
    stopTyping();
    // Sync whatever was transcribed into the edit textarea
    const words = transcriptionWords.slice(0, wordIndex);
    editTextarea.value = words.join(' ') || transcriptionWords.join(' ');
    goTo('screen-edit');
  });

  // Re-record → Listening
  btnRerecord.addEventListener('click', () => {
    goTo('screen-listen');
    startTyping();
  });

  // Send → Chat
  btnSend.addEventListener('click', () => {
    goTo('screen-chat');
    startAITyping();
  });

  // Chat mic → Listening (cycle)
  micChat.addEventListener('click', () => {
    goTo('screen-listen');
    startTyping();
  });
})();
</script>
</body>
</html>
